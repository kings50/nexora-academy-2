        ...templates[i % templates.length]
      })
    )
);


/* =========================================================
   APPLICATION STATE
   ========================================================= */

let submittingExam = false;

  screen:"login",

  currentStudent:null,

  currentIndex:0,

  answers:[],

  currentQuestions:[...allQuestions],

  timeLeft:120 * 60,

  teacherResults:[],

  studentResult:null,

  loadingTeacher:false,

  savingResult:false

};

const app = document.getElementById("app");


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TIME FORMATTER
   ========================================================= */

function formatTime(totalSeconds){

  totalSeconds = Math.max(
    0,
    Number(totalSeconds) || 0
  );

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0")
  );

}


/* =========================================================
   GRADE CALCULATOR
   ========================================================= */

function getGradeLetter(pct){

  if(pct >= 70) return "A (Excellent)";
  if(pct >= 60) return "B (Very Good)";
  if(pct >= 50) return "C (Good)";
  if(pct >= 40) return "D (Fair)";

  return "F (Fail)";

}


/* =========================================================
   TIMER
   ========================================================= */

function clearTimer(){

  if(timerInterval){

    clearInterval(timerInterval);
    timerInterval = null;

  }

}


function startTimer(){

  clearTimer();

  timerInterval = setInterval(() => {

    if(state.screen !== "exam"){

      clearTimer();
      return;

    }

    state.timeLeft--;

    if(state.timeLeft <= 0){

      state.timeLeft = 0;

      clearTimer();

      finishExam(true);

      return;

    }

    updateTimerOnly();

  },1000);

}


function updateTimerOnly(){

  const timerElement =
    document.getElementById("examTimer");

  if(!timerElement) return;

  timerElement.textContent =
    "⏱️ " + formatTime(state.timeLeft);

  if(state.timeLeft <= 300){

    timerElement.classList.add("timer-danger");

  }else{

    timerElement.classList.remove("timer-danger");

  }

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){

  if(state.screen === "login"){

    renderLogin();

  }

  else if(state.screen === "exam"){

    renderExam();

  }

  else if(state.screen === "results"){

    renderResults();

  }

  else if(state.screen === "teacher"){

    renderTeacherDashboard();

  }

}

      document.getElementById("regNumber");

    }


    const student =
      students.find(
        s =>
          s.reg.toLowerCase() ===
          reg.toLowerCase()
      );


    if(!student){

      showLoginError(
        "Invalid registration number. Please try again."
      );

      return;

    }


    clearTimer();

    submittingExam = false;

    state.currentStudent = {
      reg:student.reg,
      name:student.name
    };

    state.currentIndex = 0;

    state.answers =
      Array(
        state.currentQuestions.length
      ).fill(null);

    state.timeLeft =
      120 * 60;

    state.studentResult = null;

    state.savingResult = false;

    state.screen = "exam";

    render();

    startTimer();

  });

/* =========================================================
   SELECT ANSWER
   ========================================================= */

function selectAnswer(option){

  if(state.screen !== "exam") return;

  state.answers[
    state.currentIndex
  ] = option;

  renderExam();

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function prevQuestion(){

  if(
    state.currentIndex > 0 &&
    state.screen === "exam"
  ){

    state.currentIndex--;

    renderExam();

  }

}


/* =========================================================
   NEXT
   ========================================================= */

function nextQuestion(){

  if(
    state.currentIndex <
    state.currentQuestions.length - 1 &&
    state.screen === "exam"
  ){

    state.currentIndex++;

    renderExam();

  }

}


/* =========================================================
   JUMP TO QUESTION
   ========================================================= */

function jumpToQuestion(idx){

  if(
    state.screen !== "exam" ||
    idx < 0 ||
    idx >= state.currentQuestions.length
  ){

    return;

  }

  state.currentIndex = idx;

  renderExam();

}


/* =========================================================
   FINISH EXAM
   ========================================================= */

function finishExam(
  autoSubmitted = false
){

  if(
    submittingExam ||
    state.screen !== "exam"
  ){

    return;

  }


  if(!autoSubmitted){

    const confirmed =
      confirm(
        "Are you sure you want to submit your examination?"
      );

    if(!confirmed){

      return;

    }

  }


  submittingExam = true;

  clearTimer();


  let totalCorrect = 0;

  const subjectBreakdown = {};


  state.currentQuestions.forEach(
    (q,idx) => {

      if(!subjectBreakdown[q.subject]){

        subjectBreakdown[q.subject] = {
          correct:0,
          total:0
        };

      }


      subjectBreakdown[
        q.subject
      ].total++;


      if(
        state.answers[idx] === q.answer
      ){

        totalCorrect++;

        subjectBreakdown[
          q.subject
        ].correct++;

      }

    }
  );


  const totalQuestions =
    state.currentQuestions.length;


  const percentage =
    totalQuestions > 0

      ? Math.round(
          (
            totalCorrect /
            totalQuestions
          ) * 100
        )

      : 0;


  const grade =
    getGradeLetter(percentage);


  const resultData = {

    student:{
      reg:state.currentStudent.reg,
      name:state.currentStudent.name
    },

    score:totalCorrect,

    total:totalQuestions,

    percentage:percentage,

    grade:grade,

    breakdown:subjectBreakdown,

    date:new Date().toISOString()

  };


  state.studentResult =
    resultData;

  state.screen =
    "results";

  state.savingResult =
    true;


  renderResults();


  saveResultToGoogleSheets(
    resultData
  );

}


/* =========================================================
   SAVE RESULT TO GOOGLE SHEETS
   ========================================================= */

function saveResultToGoogleSheets(result){

  state.savingResult = true;


  const math =
    result.breakdown.Math
      ? result.breakdown.Math.correct
      : 0;


  const english =
    result.breakdown.English
      ? result.breakdown.English.correct
      : 0;


  const chemistry =
    result.breakdown.Chemistry
      ? result.breakdown.Chemistry.correct
      : 0;


  const biology =
    result.breakdown.Biology
      ? result.breakdown.Biology.correct
      : 0;


  const formData =
    new URLSearchParams();


  formData.append(
    "reg",
    result.student.reg
  );

  formData.append(
    "name",
    result.student.name
  );

  formData.append(
    "score",
    String(result.score)
  );

  formData.append(
    "total",
    String(result.total)
  );

  formData.append(
    "percentage",
    String(result.percentage)
  );

  formData.append(
    "grade",
    result.grade
  );

  formData.append(
    "math",
    String(math)
  );

  formData.append(
    "english",
    String(english)
  );

  formData.append(
    "chemistry",
    String(chemistry)
  );

  formData.append(
    "biology",
    String(biology)
  );

  formData.append(
    "timestamp",
    result.date
  );


  fetch(
    GOOGLE_SCRIPT_URL,
    {
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body:formData.toString()
    }
  )
  .then(() => {

    state.savingResult = false;

    if(state.screen === "results"){

      renderResults();

    }

  })
  .catch(error => {

    console.error(
      "Google Sheets save error:",
      error
    );

    state.savingResult = false;

    if(state.screen === "results"){

      renderResults();

    }

  });

}


/* =========================================================
   FETCH TEACHER RESULTS
   ========================================================= */

async function fetchTeacherResults(){

  state.loadingTeacher = true;


  if(state.screen === "teacher"){

    renderTeacherDashboard();

  }


  const url =
    GOOGLE_SCRIPT_URL +
    "?action=getResults" +
    "&key=" +
    encodeURIComponent(
      TEACHER_KEY
    );


  try{

    const response =
      await fetch(url,{
        method:"GET",
        cache:"no-store"
      });


    if(!response.ok){

      throw new Error(
        "Unable to connect to Google Apps Script."
      );

    }


    const data =
      await response.json();


    if(!data || !data.success){

      throw new Error(
        data && data.error
          ? data.error
          : "Google Sheets returned an error."
      );

    }


    state.teacherResults =
      Array.isArray(data.results)
        ? data.results
        : [];


    state.loadingTeacher = false;


    if(state.screen === "teacher"){

      renderTeacherDashboard();

    }

  }
  catch(error){

    console.error(
      "Failed to fetch results:",
      error
    );


    state.teacherResults = [];

    state.loadingTeacher = false;


    if(state.screen === "teacher"){

      renderTeacherError(
        error.message
      );

    }

  }

}

                ${escapeHTML(
                  r.percentage || 0
                )}%

              </p>


              <p style="margin-top:6px;">

                <strong>
                  Grade:
                </strong>

                ${escapeHTML(
                  r.grade || ""
                )}

              </p>


              <div
                style="
                  margin-top:14px;

                  border-top:1px solid var(--border);
                ">


                <p>

                  <strong>
                    Mathematics:
                  </strong>

                  ${escapeHTML(
                    r.math || 0
                  )}

                </p>


                <p style="margin-top:6px;">

                  <strong>
                    English:
                  </strong>

                  ${escapeHTML(
                    r.english || 0
                  )}

                </p>

                  <strong>
                    Chemistry:

                  )}

                    : "Unknown"
                }

              </p>

            </div>

          `
        )
        .join("")
      }

    </div>

  `;

}

  clearTimer();

  submittingExam = false;

  state.screen = "login";

  state.currentStudent = null;

  state.studentResult = null;

  state.teacherResults = [];

  state.currentIndex = 0;

  state.answers = [];

  state.timeLeft = 120 * 60;

}
